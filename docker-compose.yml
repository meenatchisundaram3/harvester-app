version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: harvester-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: harvester_root_pass
      MYSQL_DATABASE: harvester_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
